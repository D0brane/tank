# =============================================================================
# 瞄准课程训练配置
# 流程：空场固定靶 → 直线移动靶 → 直行+偶发转弯
# 晋级看评测 kill_rate / hit_rate（不用平均回报）
# =============================================================================

# 随机种子（环境重置 / PPO 共用）
seed: 42
# 总训练环境步数（所有并行环境合计）
total_timesteps: 3_000_000
# 仿真与观测 YAML（物理、obs 维数、默认奖励基线）
env_config: configs/env/sim_p0_tt2_classic.yaml
# 课程用地图（空场，无迷宫墙）
map_path: assets/maps/empty.txt

env:
  # 并行环境数量（DummyVecEnv）
  n_envs: 8
  # 观测历史堆叠帧数（MLP 输入维 = obs.dim × frame_stack）
  frame_stack: 16
  # 训练方：red=红方，blue=蓝方
  agent_side: red
  # 是否每局随机出生位姿
  random_spawn: true
  # 两车最小生成间距（像素；约 2 cell @60）
  min_spawn_dist: 120.0
  # 两车最大生成间距（像素；约 6 cell @60，可调）
  max_spawn_dist: 240.0

ppo:
  # 学习率
  learning_rate: 3.0e-4
  # 每个环境每次更新收集的步数
  n_steps: 2048
  # SGD 小批量大小
  batch_size: 256
  # 折扣因子 γ
  gamma: 0.99
  # 熵正则系数（探索）
  ent_coef: 0.01
  # MLP 隐层宽度 [层1, 层2]
  net_arch: [64, 64]

eval:
  # 每次评测的对局数（过大会严重拖慢训练；冷启动未学会时尤甚）
  n_episodes: 40
  # 每隔多少环境步做一次评测（并尝试晋级）
  every_timesteps: 50_000
  # 评测单局最长步数（小于训练默认 3000，避免空转磨满）
  max_episode_steps: 600

checkpoint:
  # 每隔多少环境步保存一次权重（另在训练结束再存 final_model.zip）
  every_timesteps: 100_000

# 阶段按顺序执行；达标后进入下一阶段；阶段内可退火对手难度
stages:
  # ---------- 阶段1：固定靶，学会对准并开火 ----------
  - name: stage1_static
    bot:
      # 对手模式：static=静止 / linear=直线 / turn_cruise=直行+转弯
      mode: static
      # 对手速度相对满速比例 [0,1]；静止阶段为 0
      speed_scale: 0.0
    reward:
      # 每步存活奖（课程关闭，避免磨时间）
      survive_per_step: 0.0
      # A* 路径缩短奖（空场关闭）
      path_delta_scale: 0.0
      # 近身弹威胁惩罚（靶子不开火，置 0）
      bullet_threat_self: 0.0
      # 瞄准对齐塑形权重（cos 朝向误差）
      aim_align_scale: 0.15
      # 瞄准目标：current=敌人现位 / lead=超前拦截点
      aim_mode: current
      # 己弹靠近敌人的稠密奖
      bullet_near_enemy: 0.25
      # 开火惩罚（抑止空枪；成功射出时）
      fire_penalty: -0.01
      # 冷却未过仍按开火（意图开火未射出且仍在 CD）
      fire_on_cd_penalty: -0.05
      # 击杀稀疏奖
      kill: 100.0
      # 被击杀惩罚
      death: -100.0
    promote:
      # 晋级指标：kill_rate=击杀率 / hit_rate=命中率
      metric: kill_rate
      # 达标阈值（评测窗口均值）
      threshold: 0.70
      # 击杀局中位耗时上限（帧）；超时视为磨死，不晋级
      max_median_ttk: 900

  # ---------- 阶段2：直线匀速靶，学会提前量 ----------
  - name: stage2_linear
    bot:
      mode: linear
      # 阶段开始时的速度比例
      speed_scale: 0.3
      # 退火结束时的速度比例（满速=1.0）
      speed_scale_end: 1.0
      # 速度从 start→end 的线性退火环境步数
      anneal_timesteps: 400_000
    reward:
      survive_per_step: 0.0
      path_delta_scale: 0.0
      bullet_threat_self: 0.0
      aim_align_scale: 0.12
      # 本阶段用超前瞄准
      aim_mode: lead
      bullet_near_enemy: 0.2
      fire_penalty: -0.01
      fire_on_cd_penalty: -0.05
      kill: 100.0
      death: -100.0
    promote:
      metric: hit_rate
      threshold: 0.50
      # 仅当当前 speed_scale 已退火到该值才允许晋级
      require_speed_scale: 1.0

  # ---------- 阶段3：偶发转弯，抗机动；瞄准塑形衰减 ----------
  - name: stage3_turn_cruise
    bot:
      mode: turn_cruise
      speed_scale: 1.0
      # 平均直行帧数（越大越少转弯）；阶段开始值
      mean_straight_frames: 240.0
      # 退火结束值（转弯更勤）
      mean_straight_frames_end: 60.0
      # 每次转弯持续帧数
      turn_duration: 25
      # 直行间隔从 start→end 的退火步数
      anneal_timesteps: 600_000
    reward:
      survive_per_step: 0.0
      path_delta_scale: 0.0
      bullet_threat_self: 0.0
      # 瞄准塑形明显减小，逼靠击杀信号
      aim_align_scale: 0.04
      aim_mode: lead
      bullet_near_enemy: 0.15
      fire_penalty: -0.01
      fire_on_cd_penalty: -0.05
      kill: 100.0
      death: -100.0
    promote:
      metric: kill_rate
      threshold: 0.55
      # 仅当 mean_straight_frames 已退火到 ≤ 该值才允许晋级
      require_mean_straight_frames: 60.0
