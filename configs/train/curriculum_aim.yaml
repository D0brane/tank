# =============================================================================
# 瞄准课程训练配置
# 流程：随机尺寸空场（有外框墙、无内墙）固定靶 → 直线移动靶 → 直行+偶发转弯
# 观测：58 维选择性稀疏堆叠 frame_stack=3 stride=3（敌方/墙/A*×3 + 开火+子弹仅当前）→ 92；
#       stack_action_mean=true 再加均值×3 → 101
# 晋级看评测 hit_rate = 直击次数/己方开火数；kill_rate = 命中次数（含反弹）/己方开火数
# 评测：首次直击即止；TTK=首直击步数，无直击=结束步数（≤eval.max_episode_steps）
# =============================================================================

# 随机种子（环境重置 / PPO 共用）
seed: 42
# 总训练环境步数（设很大便于一直训；手动 Ctrl+C 结束）
total_timesteps: 100_000_000
# 仿真与观测 YAML（58 维含雷达；物理与 classic 一致）
env_config: configs/env/sim_p0_tt2_aim_open.yaml
# 回退地图（arena.mode=map 时用；random_open 时每局程序化生成）
map_path: assets/maps/empty.txt

# 每局随机尺寸空场（世界边界=外框墙；无内墙）
arena:
  mode: random_open
  cols: [8, 12]
  rows: [4, 6]

env:
  # 并行环境数量（DummyVecEnv）
  n_envs: 8
  # 送入网络的采样帧数（MLP 输入维 = 58 × frame_stack）
  frame_stack: 3
  # 相邻采样点间隔 tick（3 → 取 t-6,t-3,t；stride=1 为连续堆叠）
  frame_stride: 3
  # 是否在帧堆叠后拼接稀疏堆叠的确定性动作均值（与 frame_stack/stride 对齐）
  stack_action_mean: true
  # 训练方：red=红方，blue=蓝方
  agent_side: red
  # 是否每局随机出生位姿
  random_spawn: true
  # 两车最小生成间距（像素；约 2 cell @60）
  min_spawn_dist: 120.0
  # 两车最大生成间距（像素；约 6 cell @60，可调）
  max_spawn_dist: 240.0

ppo:
  # 学习率（再降一档，抑止 std 爆炸后续训发散）
  learning_rate: 3.0e-5
  # 每个环境每次更新收集的步数
  n_steps: 2048
  # SGD 小批量大小
  batch_size: 256
  # 折扣因子 γ
  gamma: 0.99
  # 熵正则：起点 → 终点线性衰减（探索随训减弱）
  ent_coef: 0.01
  ent_coef_end: 0.001
  # 自本次续训起点起，多少环境步内衰减到 ent_coef_end
  ent_coef_decay_timesteps: 2_000_000
  # 高斯策略 log_std 钳制（std=exp(log_std)；上限 0 → std≤1）
  log_std_min: -5.0
  log_std_max: 0.0
  # MLP 隐层宽度 [层1, 层2]
  net_arch: [256, 128]

eval:
  # 每次评测的对局数（过大会严重拖慢训练；冷启动未学会时尤甚）
  n_episodes: 100
  # 每隔多少环境步做一次评测（并尝试晋级）
  every_timesteps: 100_000
  # 评测单局最长步数（小于训练默认 3000，避免空转磨满）
  max_episode_steps: 600

checkpoint:
  # 每隔多少环境步保存一次权重（另在训练结束再存 final_model.zip）
  every_timesteps: 100_000

# 阶段按顺序执行；达标后进入下一阶段；阶段内可退火对手难度
stages:
  # ---------- 阶段1：固定靶，学会对准并开火 ----------
  - name: stage1_static
    bot:
      # 对手模式：static=静止 / linear=直线 / turn_cruise=直行+转弯
      mode: static
      # 对手速度相对满速比例 [0,1]；静止阶段为 0
      speed_scale: 0.0
    reward:
      # 每步存活奖（课程关闭，避免磨时间）
      survive_per_step: -0.05
      # A* 路径缩短奖（空场关闭）
      path_delta_scale: 0.0
      # 近身弹威胁惩罚（靶子不开火，置 0）
      bullet_threat_self: -0.15
      # 瞄准对齐塑形权重：scale × max(0,cos(Δθ))^power
      aim_align_scale: 0.2
      # 幂次：越大越尖（奖励集中在接近 0°）
      aim_align_power: 4.0
      # 瞄准目标：current=敌人现位 / lead=超前拦截点
      aim_mode: current
      # 己弹靠近敌人：scale × (1 - d/margin)^power
      bullet_near_enemy: 0.10
      bullet_near_enemy_margin: 80.0
      bullet_near_enemy_power: 4.0
      # 开火惩罚（抑止空枪；成功射出时）
      fire_penalty: -1
      # 冷却未过仍按开火（意图开火未射出且仍在 CD）
      fire_on_cd_penalty: -0.02
      # 每步前进/后退惩罚
      move_penalty: -0.001
      # 每步转向惩罚（由 rotate_penalty_schedule 覆盖；此处为文档默认）
      rotate_penalty: -0.09
      # 前进↔后退切换惩罚（抑止原地抽搐）
      move_switch_penalty: -0.02
      # 贴边/贴墙高次惩罚（外框墙）
      wall_proximity_scale: -0.8
      wall_proximity_margin: 50.0
      wall_proximity_power: 4.0
      # 贴敌高次惩罚：仅很近才大罚
      enemy_proximity_scale: -0.8
      enemy_proximity_margin: 150.0
      enemy_proximity_power: 4.0
      # 击杀稀疏奖（直击）
      kill: 60.0
      # 己弹反弹后再击杀
      kill_bounce: 0.0
      # 被击杀惩罚
      death: -40.0
    promote:
      # 晋级指标：hit_rate=直击次数/开火；kill_rate=命中次数/开火（含反弹）
      metric: hit_rate
      # 达标阈值（评测局内子弹比率的汇总：sum(直击)/sum(开火)）
      threshold: 0.10
      # 击杀局中位耗时上限（帧）；超时视为磨死，不晋级
      max_median_ttk: 900

  # ---------- 阶段2：直线匀速靶，学会提前量 ----------
  - name: stage2_linear
    bot:
      mode: linear
      # 阶段开始时的速度比例
      speed_scale: 0.3
      # 退火结束时的速度比例（满速=1.0）
      speed_scale_end: 1.0
      # 速度从 start→end 的线性退火环境步数
      anneal_timesteps: 400_000
    reward:
      # 与阶段1同套；仅 aim_mode 改为 lead（超前拦截）
      survive_per_step: -0.01
      path_delta_scale: 0.0
      bullet_threat_self: -0.15
      aim_align_scale: 0.1
      aim_align_power: 4.0
      aim_mode: lead
      bullet_near_enemy: 0.10
      bullet_near_enemy_margin: 80.0
      bullet_near_enemy_power: 4.0
      fire_penalty: -1
      fire_on_cd_penalty: -0.02
      move_penalty: -0.001
      rotate_penalty: -0.07
      move_switch_penalty: -0.02
      wall_proximity_scale: -0.4
      wall_proximity_margin: 50.0
      wall_proximity_power: 4.0
      enemy_proximity_scale: -0.8
      enemy_proximity_margin: 150.0
      enemy_proximity_power: 4.0
      kill: 60.0
      kill_bounce: 0.0
      death: -40.0
    promote:
      metric: hit_rate
      threshold: 0.06
      require_speed_scale: 1.0

  # ---------- 阶段3：偶发转弯，抗机动 ----------
  - name: stage3_turn_cruise
    bot:
      mode: turn_cruise
      speed_scale: 1.0
      # 平均直行帧数（越大越少转弯）；阶段开始值
      mean_straight_frames: 240.0
      # 退火结束值（转弯更勤）
      mean_straight_frames_end: 60.0
      # 每次转弯持续帧数
      turn_duration: 25
      # 直行间隔从 start→end 的退火步数
      anneal_timesteps: 600_000
    reward:
      # 与阶段1同套；aim_mode=lead
      survive_per_step: -0.01
      path_delta_scale: 0.0
      bullet_threat_self: -0.15
      aim_align_scale: 0.1
      aim_align_power: 4.0
      aim_mode: lead
      bullet_near_enemy: 0.10
      bullet_near_enemy_margin: 80.0
      bullet_near_enemy_power: 4.0
      fire_penalty: -1
      fire_on_cd_penalty: -0.02
      move_penalty: -0.001
      rotate_penalty: -0.07
      move_switch_penalty: -0.02
      wall_proximity_scale: -0.4
      wall_proximity_margin: 50.0
      wall_proximity_power: 4.0
      enemy_proximity_scale: -0.4
      enemy_proximity_margin: 150.0
      enemy_proximity_power: 4.0
      kill: 60.0
      kill_bounce: 0.0
      death: -40.0
    promote:
      metric: hit_rate
      threshold: 0.05
      require_mean_straight_frames: 60.0

# 锁定转向惩罚；schedule 开启仅用于禁止晋级下一阶段（现锁 stage2，不进 stage3）
# 档位固定 -0.07；threshold 不可达 → 永不 advance/stop
rotate_penalty_schedule:
  enabled: true
  threshold: 1.01
  compare: gt
  stop_after_last: false
  levels: [-0.07]
