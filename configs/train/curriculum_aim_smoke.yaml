# 冒烟 / 容量探测用（短跑，少评测）
seed: 0
total_timesteps: 20000
env_config: configs/env/sim_p0_tt2_classic.yaml
map_path: assets/maps/empty.txt

env:
  n_envs: 8
  frame_stack: 16
  agent_side: red
  random_spawn: true
  min_spawn_dist: 120.0
  max_spawn_dist: 360.0

ppo:
  learning_rate: 3.0e-4
  n_steps: 512
  batch_size: 256
  gamma: 0.99
  ent_coef: 0.01
  net_arch: [64, 64]

eval:
  n_episodes: 4
  every_timesteps: 1_000_000_000

stages:
  - name: stage1_static
    bot:
      mode: static
      speed_scale: 0.0
    reward:
      survive_per_step: 0.0
      path_delta_scale: 0.0
      bullet_threat_self: 0.0
      aim_align_scale: 0.15
      aim_mode: current
      bullet_near_enemy: 0.25
      fire_penalty: -0.01
      fire_on_cd_penalty: -0.05
      kill: 100.0
      death: -100.0
    promote:
      metric: kill_rate
      threshold: 0.99
