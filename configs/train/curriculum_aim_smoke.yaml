# 冒烟 / 容量探测用（短跑，少评测）
seed: 0
total_timesteps: 20000
env_config: configs/env/sim_p0_tt2_aim_open.yaml
map_path: assets/maps/empty.txt

arena:
  mode: random_open
  cols: [8, 10]
  rows: [4, 5]

env:
  n_envs: 8
  frame_stack: 16
  agent_side: red
  random_spawn: true
  min_spawn_dist: 120.0
  max_spawn_dist: 360.0

ppo:
  learning_rate: 3.0e-4
  n_steps: 512
  batch_size: 256
  gamma: 0.99
  ent_coef: 0.01
  net_arch: [64, 64]

eval:
  n_episodes: 4
  every_timesteps: 1_000_000_000

stages:
  - name: stage1_static
    bot:
      mode: static
      speed_scale: 0.0
    reward:
      survive_per_step: 0.0
      path_delta_scale: 0.0
      bullet_threat_self: 0.0
      aim_align_scale: 0.15
      aim_align_power: 8.0
      aim_mode: current
      bullet_near_enemy: 0.25
      fire_penalty: -0.01
      fire_on_cd_penalty: -0.05
      move_penalty: -0.002
      rotate_penalty: 0.0
      move_switch_penalty: -0.02
      wall_proximity_scale: 0.0
      wall_proximity_margin: 40.0
      wall_proximity_power: 4.0
      enemy_proximity_scale: -0.2
      enemy_proximity_margin: 100.0
      enemy_proximity_power: 4.0
      kill: 100.0
      kill_bounce: 40.0
      death: -100.0
    promote:
      metric: hit_rate
      threshold: 0.99
